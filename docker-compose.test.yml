services:
  postgres-test:
    image: postgres:17
    container_name: resolvex-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: resolvex_test
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_user
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d resolvex_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - resolvex-postgres-test-data:/var/lib/postgresql/data

volumes:
  resolvex-postgres-test-data:
